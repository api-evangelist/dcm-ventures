aid: dcm-ventures
name: DCM Ventures
description: >-
  DCM Ventures (formerly Doll Capital Management, and commonly known as DCM) is an early-stage venture
  capital firm founded in 1996 by Dixon Doll, a former Accel partner, and David Chao, and headquartered
  at 2420 Sand Hill Road in Menlo Park, California with additional offices in Beijing and Tokyo. DCM was
  among the first Silicon Valley firms to build a cross-border, US-Asia investing practice, and typically
  leads early-stage rounds with checks in the roughly $1M-$5M range, deploying capital into a small group
  of category-defining companies each year rather than investing broadly. The firm's thesis has evolved
  from its original focus on communications and semiconductors toward consumer internet and SaaS, and today
  centers on vertical SaaS, fintech, cross-border innovation, and AI-native applications across the United
  States, China, Japan, and Southeast Asia. As of 2025 DCM manages approximately $4.5 billion in assets and
  reports 400+ portfolio companies, 35+ unicorns, and over $150 billion in aggregate market value, with
  notable investments including SoFi, Bill.com, Kuaishou, Matterport, 51job, Careem, and Sansan.
